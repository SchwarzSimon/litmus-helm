on: push

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3 # branch testbranch6
        with:
          ref: testbranch6
      # Rollback last commit.
      - name: Rollback last commit
        run: |
          git reset --hard HEAD~1
          git push origin HEAD --force