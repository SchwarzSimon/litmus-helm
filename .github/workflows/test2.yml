name: Auto-merge PRs
on:
  pull_request_target:
    types: [opened, synchronize]

permissions:
  pull-requests: write
  contents: write
  actions: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Auto-merge the PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr merge "$PR" \
            --repo "$REPO" \
            --merge \
            --admin
      - name: Tag second-to-last
        run: |
          # Get the PR head commits
          git fetch origin testb

          # Second-to-last commit on the PR branch
          SECOND_LAST_COMMIT=$(git rev-list --max-count=2 FETCH_HEAD | tail -n 1)

          git tag -f def "$SECOND_LAST_COMMIT"
          git push origin -f refs/tags/def
